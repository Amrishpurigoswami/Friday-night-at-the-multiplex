[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-pricing-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]